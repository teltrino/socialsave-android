name: Bug report
description: Report an installation, preview, or download problem.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: App version and engine version
      description: Find these in About & open-source licenses.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: OPPO Reno4, Android 12
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Include steps, source website, format/quality, and expected behavior. Share a public example link only if appropriate.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error details
      description: Use View error details > Copy details. Remove private URLs, tokens, and personal information first.
      render: text
